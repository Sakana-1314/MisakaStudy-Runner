name: 调试签到发布探针

# 临时诊断工作流：只输出各阶段是否成功（PROBE 行），不输出 classId/activeId/响应正文。
# 仅用于排查「签到发布」在 GitHub 跑步机上失败在登录/班级列表/发布哪一步，验证完删除分支。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要探测的 MisakaStudy 分支或 commit（留空用 next）
        required: false
        default: next

permissions:
  contents: read

jobs:
  probe:
    name: 探针
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/core
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ inputs.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 分阶段探测
        env:
          LIVE_UPSTREAM: '1'
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
          CX_STUDENT: ${{ secrets.CX_STUDENT }}
          TZ: Asia/Shanghai
        run: |
          cat > tests/live/probe_test.go <<'EOF'
          package live

          import (
          	"testing"
          	"time"
          )

          // TestProbeStages 只验证各阶段是否通过，日志里不带任何 ID 与响应正文。
          func TestProbeStages(t *testing.T) {
          	liveEnabled(t)
          	credential := teacherSignCredentials(t)
          	student := studentSignCredentials(t)
          	location := teacherSignLocationFromEnv()
          	client, cookies := loginTeacher(t, credential)
          	t.Logf("PROBE: teacher_login ok")
          	signerClient, signerCookies := loginStudent(t, student)
          	t.Logf("PROBE: student_login ok")
          	classes := teacherClasses(t, client, cookies, credential)
          	t.Logf("PROBE: classes ok count=%d", len(classes))
          	mode := teacherSignMode()
          	groupID := ensureTeacherGroup(t, client, cookies, credential, classes, teacherSignGroupName(mode))
          	t.Logf("PROBE: group ok")
          	_ = newStudentSelfSigner(t, signerClient, signerCookies, client, cookies, location, student.face)
          	t.Logf("PROBE: device_session ok")
          	for i, class := range classes {
          		deleted, failed := cleanupClassForMode(t, client, cookies, credential, class, mode, groupID)
          		t.Logf("PROBE: cleanup class=%d deleted=%d failed=%d", i, deleted, failed)
          	}
          	variant := teacherSignVariant{name: "普通签到（拍照+滑块验证）", otherID: "0", photo: true}
          	class := classes[0]
          	activeID := publishTeacherSign(t, client, cookies,
          		teacherPublishQuery(credential.courseID, class.ID, location, variant, variant.name))
          	t.Logf("PROBE: publish ok")
          	detail := fetchTeacherActiveData(t, client, cookies, activeID)
          	t.Logf("PROBE: detail ok")
          	verifyTeacherSign(t, variant, location, detail)
          	t.Logf("PROBE: verify ok")
          	verifyTeacherSignEndTime(t, detail, nextSaturdayFiveAM(time.Now()))
          	t.Logf("PROBE: end_time ok")
          }
          EOF
          # 失败时 test 会打印含 ID 的细节，只回显阶段标记，不回显原始输出。
          go test ./tests/live -run TestProbeStages -v -count=1 > probe.log 2>&1 || true
          grep -oE "PROBE: [a-z_ ]+(ok|failed)[^\"']*" probe.log | sed -E 's/[0-9]{4,}/***/g' || true
          rm -f probe.log
