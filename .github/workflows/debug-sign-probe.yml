name: 调试签到发布探针

# 临时诊断工作流：跑完整「签到发布」用例，只回显脱敏后的失败位置
# （子测试名、file:line、命中固定错误标签），不输出 classId/activeId/响应正文/凭据。
# 仅用于排查 CI 失败，验证完删除该工作流。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 要探测的 MisakaStudy 分支或 commit（留空用 next）
        required: false
        default: next

permissions:
  contents: read

jobs:
  probe:
    name: 探针
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/core
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ inputs.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 跑完整用例并脱敏回显
        env:
          LIVE_UPSTREAM: '1'
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
          CX_STUDENT: ${{ secrets.CX_STUDENT }}
          TZ: Asia/Shanghai
        run: |
          set +e
          go test ./tests/live -run TestLiveTeacherPublishAllSignTypes -v -count=1 > probe.log 2>&1
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "PROBE: full_test ok"
          else
            echo "PROBE: full_test failed rc=$rc"
          fi
          echo "--- 失败的子测试 ---"
          grep -aE "^--- FAIL|^    --- FAIL" probe.log
          echo "--- 失败位置（file:line） ---"
          grep -aoE "(teacher_sign_[a-z_]+_test|helpers)_test\.go:[0-9]+" probe.log | sort -u
          echo "--- 命中的固定错误标签 ---"
          for key in \
            "签到类型不符" \
            "应开启滑块验证" \
            "上游未把防作弊标记置为开启" \
            "应开启微信内签到限制" \
            "应要求拍照" \
            "应开启人脸识别" \
            "应指定签到地点" \
            "签到地点文案不符" \
            "签到纬度不符" \
            "签到经度不符" \
            "签到范围不符" \
            "二维码签到不应开启自动更新" \
            "静态二维码的刷新间隔应为" \
            "手势签到码不符" \
            "签到结束时间" \
            "个旧活动删除失败" \
            "发起签到失败" \
            "读取签到详情失败" \
            "获取签到二维码失败" \
            "panic:"; do
            if grep -aqF "$key" probe.log; then
              printf 'PROBE_HIT: %s\n' "$key"
            fi
          done
          rm -f probe.log
