name: 端到端模拟测试

# 由 MisakaStudy 仓库的 trigger.yml 通过 repository_dispatch 触发（push 事件）
# 仅当 server 路径有变更时运行，并把状态回写到对应 commit
on:
  repository_dispatch:
    types: [misaka_push]

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/**'

  e2e:
    name: 端到端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: misaka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: server

    env:
      db_user: postgres
      db_password: test
      db_host: 127.0.0.1
      db_port: 5432
      db_name: misaka_e2e
      secret: e2e-test-secret-key-32chars!!
      # 内部令牌由环境变量注入，服务端进程与 E2E 客户端须取同一值
      INTERNAL_TOKEN: test-admin-token
      # 主小程序 AppID（必填）：取测试假值，与 cmd/dbseed 种子的小程序一致
      MAIN_APPID: wx-e2e-test-appid
      E2E_BASE_URL: http://127.0.0.1:8000
      # 真机学习通账号由下面「解析学习通测试凭据」步骤从 CX_STUDENT / CX_TEACHER 解析后写入 GITHUB_ENV

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 创建数据库表并填充测试数据
        run: |
          go run ./cmd/dbinit
          go run ./cmd/dbseed

      - name: 启动后端服务
        run: |
          go build -o /tmp/misaka-server ./cmd/server
          # 服务在 /tmp/e2e-run 下启动：logs/ 等运行期文件写到可写目录，不污染检出目录。
          cd /tmp && mkdir -p e2e-run && cd e2e-run
          nohup /tmp/misaka-server > /tmp/e2e-run/server.log 2>&1 &
          echo $! > /tmp/server.pid
          cd "$GITHUB_WORKSPACE/server"

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/status > /dev/null; then
              echo "服务已就绪"
              exit 0
            fi
            echo "等待服务启动... ($i/30)"
            sleep 1
          done
          echo "服务启动超时"
          exit 1

      - name: 解析学习通测试凭据
        # 机密格式：username=<手机号>&password=<口令>&courseId=<课程>&classId=<班级>
        # CX_STUDENT 供「绑定 / 签到」真机用例；CX_TEACHER 供教师侧发签到用例。
        # 两个机密都带 courseId/classId 时以 CX_STUDENT 为准（后解析者覆盖）。
        env:
          CX_STUDENT_RAW: ${{ secrets.CX_STUDENT }}
          CX_TEACHER_RAW: ${{ secrets.CX_TEACHER }}
        run: |
          set -euo pipefail
          parse() {
            local scope="$1"
            local raw="$2"
            if [ -z "$raw" ]; then
              return 0
            fi
            printf '%s' "$raw" | tr '&' '\n' | while IFS= read -r pair; do
              if [ -z "$pair" ]; then
                continue
              fi
              key="${pair%%=*}"
              value="${pair#*=}"
              if [ "$key" = "$pair" ]; then
                continue
              fi
              case "$key" in
                username) printf '%s\n' "${scope}_USERNAME=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                password) printf '%s\n' "${scope}_PASSWORD=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                courseId) printf '%s\n' "E2E_COURSE_ID=$value" >> "$GITHUB_ENV" ;;
                classId) printf '%s\n' "E2E_CLASS_ID=$value" >> "$GITHUB_ENV" ;;
              esac
            done
          }
          parse CX_TEACHER "$CX_TEACHER_RAW"
          parse CX "$CX_STUDENT_RAW"
      - name: 运行 E2E 测试
        run: go test ./tests/e2e/... -v

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-e2e
          path: |
            /tmp/e2e-run/server.log
            /tmp/e2e-run/logs/
          if-no-files-found: ignore

      - name: 停止后端服务
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            wait $(cat /tmp/server.pid) 2>/dev/null || true
          fi

  status:
    name: 回写 E2E 状态
    if: always()
    needs: [detect, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: 回写 E2E 状态到 MisakaStudy
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # server 无变更跳过时不回写失败状态
          if [ "${{ needs.detect.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "skipped" ]; then
            echo "::notice::server 路径无变更，跳过 E2E"
            exit 0
          fi
          state=failure
          if [ "${{ needs.detect.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]; then
            state=success
          fi
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/${{ github.event.client_payload.ref }} \
            -f state="$state" \
            -f context='E2E 模拟测试（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
