name: 端到端模拟测试

# 由 MisakaStudy 仓库的 trigger.yml 通过 repository_dispatch 触发（push 事件）
# 仅当 server 路径有变更时运行，并把状态回写到对应 commit
on:
  repository_dispatch:
    types: [misaka_push]

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/**'

  e2e:
    name: 端到端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: misaka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: server

    env:
      db_user: root
      db_password: test
      db_host: 127.0.0.1
      db_port: 3306
      db_name: misaka_e2e
      secret: e2e-test-secret-key-32chars!!
      # 内部令牌由环境变量注入，服务端进程与 E2E 客户端须取同一值
      INTERNAL_TOKEN: test-admin-token
      # 主小程序 AppID（必填）：取测试假值，与 cmd/dbseed 种子的小程序一致
      MAIN_APPID: wx-e2e-test-appid
      E2E_BASE_URL: http://127.0.0.1:8000
      # 真机学习通账号：注入后在线用例才会执行（缺失时用例自行 skip）
      CX_USERNAME: ${{ secrets.CX_USERNAME }}
      CX_PASSWORD: ${{ secrets.CX_PASSWORD }}

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 创建数据库表并填充测试数据
        run: |
          go run ./cmd/dbinit
          go run ./cmd/dbseed

      - name: 启动后端服务
        run: |
          go build -o /tmp/misaka-server ./cmd/server
          cd /tmp && mkdir -p e2e-run && cd e2e-run
          cp -r "$GITHUB_WORKSPACE/server/templates" .
          nohup /tmp/misaka-server > /tmp/e2e-run/server.log 2>&1 &
          echo $! > /tmp/server.pid
          cd "$GITHUB_WORKSPACE/server"

      - name: 等待服务就绪
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/public/state > /dev/null; then
              echo "服务已就绪"
              exit 0
            fi
            echo "等待服务启动... ($i/30)"
            sleep 1
          done
          echo "服务启动超时"
          exit 1

      - name: 运行 E2E 测试
        run: go test ./tests/e2e/... -v

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-e2e
          path: |
            /tmp/e2e-run/server.log
            /tmp/e2e-run/logs/
          if-no-files-found: ignore

      - name: 停止后端服务
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            wait $(cat /tmp/server.pid) 2>/dev/null || true
          fi

  status:
    name: 回写 E2E 状态
    if: always()
    needs: [detect, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: 回写 E2E 状态到 MisakaStudy
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # server 无变更跳过时不回写失败状态
          if [ "${{ needs.detect.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "skipped" ]; then
            echo "::notice::server 路径无变更，跳过 E2E"
            exit 0
          fi
          state=failure
          if [ "${{ needs.detect.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]; then
            state=success
          fi
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/${{ github.event.client_payload.ref }} \
            -f state="$state" \
            -f context='E2E 模拟测试（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
