name: 小程序代码上传


on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则自动用 v<当天日期>-misaka.NN，同日两位自增不重复）
        required: false
        default: ""
        type: string
      robot:
        description: 机器人编号 1-30（手动上传默认 1）
        required: false
        default: "1"
        type: string
      desc:
        description: 版本描述（PR 自动上传固定为「由 GitHub Actions 自动上传！」）
        required: false
        default: "由 GitHub Actions 自动上传！"
        type: string
  repository_dispatch:
    types: [misaka_miniprogram]

concurrency:
  group: upload-miniprogram-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  upload:
    name: 上传小程序
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: 安装依赖
        working-directory: miniprogram
        run: npm install --no-audit --no-fund --include=dev

      - name: 计算版本号
        id: meta
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          EVENT: ${{ github.event_name }}
          PAYLOAD_EVENT: ${{ github.event.client_payload.event_name }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          VERSION_INPUT: ${{ inputs.version }}
          ROBOT_INPUT: ${{ inputs.robot }}
          DESC_INPUT: ${{ inputs.desc }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "repository_dispatch" ]; then
            if [ "$PAYLOAD_EVENT" = "pull_request" ]; then
              PR_DATA="$(gh api repos/Sakana-1314/MisakaStudy/pulls/"$PR_NUMBER")"
              MERGED="$(echo "$PR_DATA" | jq -r '.merged')"
              STATE="$(echo "$PR_DATA" | jq -r '.state')"
              if [ "$MERGED" = "true" ]; then
                VERSION="PR #${PR_NUMBER}（已合并）"
              elif [ "$STATE" = "closed" ]; then
                VERSION="PR #${PR_NUMBER}（已关闭）"
              else
                VERSION="PR #${PR_NUMBER}"
              fi
              ROBOT=$(( 21 + (PR_NUMBER % 10) ))
              DESC="由 GitHub Actions 自动上传！"
            else
              ROOT="$(git rev-parse --show-toplevel)"
              VERSION="$("$ROOT/miniprogram/scripts/next-version.sh" Sakana-1314/MisakaStudy)"
              ROBOT=1
              DESC="$(git log -1 --pretty=%s)"
            fi
          else
            VERSION="$VERSION_INPUT"
            if [ -z "$VERSION" ]; then
              ROOT="$(git rev-parse --show-toplevel)"
              VERSION="$("$ROOT/miniprogram/scripts/next-version.sh" Sakana-1314/MisakaStudy)"
            fi
            ROBOT="$ROBOT_INPUT"
            DESC="$DESC_INPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "robot=$ROBOT" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"

      - name: 构建并发布代码包
        if: github.event_name != 'repository_dispatch' || github.event.client_payload.event_name != 'pull_request'
        working-directory: miniprogram
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "$ZIP_PASSWORD" ] || { echo "缺少 ZIP_PASSWORD 机密，无法加密代码包"; exit 1; }

          OUTPUT="${RUNNER_TEMP}/miniprogram.zip"
          bash scripts/build-ci-package.sh "$VERSION" "$OUTPUT"

          TAG="mp-$(printf '%s' "$VERSION" | sha256sum | cut -c1-16)"
          NOTES="小程序加密代码包；版本 ${VERSION}；构建时间 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUTPUT#miniprogram.zip" --clobber --repo "$REPO"
            gh release edit "$TAG" --title "$VERSION" --notes "$NOTES" --repo "$REPO"
          else
            gh release create "$TAG" "$OUTPUT#miniprogram.zip" \
              --repo "$REPO" --title "$VERSION" --notes "$NOTES"
          fi
          rm -f "$OUTPUT"

      - name: 上传小程序代码
        working-directory: miniprogram
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
          ROBOT: ${{ steps.meta.outputs.robot }}
          DESC: ${{ steps.meta.outputs.desc }}
        run: |
          set -euo pipefail
          APPID="$(jq -r '.appid' project.config.json)"
          KEY_PATH=".private/private.${APPID}.key"
          [ -f "$KEY_PATH" ] || { echo "未找到代码上传密钥 $KEY_PATH"; exit 1; }

          npx --no-install miniprogram-ci pack-npm \
            --pp ./ \
            --pkp "$KEY_PATH" \
            --appid "$APPID"
          [ -d ./miniprogram_npm/tdesign-miniprogram ] || {
            echo "miniprogram_npm/tdesign-miniprogram 构建产物缺失"; exit 1;
          }

          echo "上传目标 appid=${APPID} version=${VERSION} robot=${ROBOT} baseUrl=${BASE_URL:-线上}"
          node scripts/inject-build-info.js "$VERSION" "$(date +%s)"
          npx --no-install miniprogram-ci upload \
            --appid "$APPID" \
            --pp . \
            --pkp "$KEY_PATH" \
            --uv "$VERSION" \
            --ud "$DESC" \
            --robot "$ROBOT" \
            --threads 1 \
            --enable-es6 --enable-es7 --enable-autoprefixwxss \
            --enable-minify --enable-code-protect \
            --pi \
              "node_modules/**" ".private/**" ".keystore" "static/resource/**" \
              "ci/**" \
              "package.json" "package-lock.json" "README.md" \
              "miniapp/**" "project.miniapp.json" "app.miniapp.json" "privacy.miniapp.json"

      - name: 回写上传状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写上传状态到 MisakaStudy")) | .id' | head -1)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$JOB_ID"
          SHA="$(git rev-parse HEAD)"
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/"$SHA" \
            -f state="$state" \
            -f context='上传小程序代码（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$RUN_URL"

          if [ "$EVENT" = "repository_dispatch" ] && [ -n "$PR_NUMBER" ]; then
            if [ "$state" = "success" ]; then
              summary="小程序代码已上传为体验版（PR #${PR_NUMBER}）✅"
            else
              summary="小程序代码上传失败 ❌"
            fi
            body=$(printf '🤖 **MisakaStudy Runner**：%s\n\n[查看上传工作流 Job](%s)' "$summary" "$RUN_URL")
            jq -n --arg body "$body" '{body:$body}' | \
              gh api -X POST "repos/Sakana-1314/MisakaStudy/issues/$PR_NUMBER/comments" --input -
          fi
