name: 验证 Node.js 24 action

# 临时工作流：仅用于验证 action 升级后的真实运行情况，验证完成即删除。
on:
  push:
    branches:
      - chore/node24-actions
  workflow_dispatch:

jobs:
  verify:
    name: 验证升级后的 action
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码（checkout v7）
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          token: ${{ secrets.PAT }}
          fetch-depth: 2

      - name: 检测变更路径（paths-filter v4）
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: HEAD~1
          ref: HEAD
          filters: |
            server:
              - 'server/**'

      - name: 输出 paths-filter 结果
        run: echo "server=${{ steps.filter.outputs.server }}"

      - name: 安装 Go（setup-go v7）
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 验证 Go
        run: go version

      - name: 安装 Node（setup-node v7）
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: 验证 Node
        run: node -v

      - name: 准备上传文件
        run: echo "node24 actions ok" > "$RUNNER_TEMP/verify.txt"

      - name: 上传产物（upload-artifact v7）
        uses: actions/upload-artifact@v7
        with:
          name: verify-node24
          path: ${{ runner.temp }}/verify.txt

      - name: 安装 QEMU（setup-qemu v4）
        uses: docker/setup-qemu-action@v4

      - name: 安装 Docker Buildx（setup-buildx v4）
        uses: docker/setup-buildx-action@v4

      - name: 登录腾讯云容器镜像服务（login v4）
        uses: docker/login-action@v4
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 准备最小构建上下文
        run: |
          mkdir -p verify-context
          printf 'FROM alpine:3.20\nRUN echo ok\n' > verify-context/Dockerfile

      - name: 构建镜像不推送（build-push v7）
        uses: docker/build-push-action@v7
        with:
          context: ./verify-context
          push: false
          tags: verify-node24:local
          platforms: linux/amd64
