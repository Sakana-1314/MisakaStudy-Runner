name: 静态站点发布

# 把 MisakaStudy 的 web/** 构建产物发布到该仓库 gh-pages 分支，供 GitHub Pages 托管。
#
# 目前发布两个站点，统一收在 `view/` 下：
#   web/admin → view/admin/   管理端
#   web/guest → view/guest/   访客端（设备参数等公开工具页）
#
# 触发方式：
#   1) 自动：MisakaStudy 的 trigger.yml 在 push 到 next 时**无条件**派发 misaka_push，
#      该不该发布由本文件的 paths-filter 判断（web/** 变更才发布）；
#   2) 手动：本仓库 Actions 页「Run workflow」（可用 base_path 覆盖部署路径）。
#
# gh-pages 是纯产物分支：每次构建后整体重建并**强制覆盖**，不留提交历史。
# 也正因为是强制覆盖，两个站点**必须在同一次提交里一起发布** ——
# 分开两次发的话，后一次会把前一次的目录整个删掉。所以这里只有 publish 一个任务，
# 顺序构建两个站点、最后一并提交。
#
# ## 站点根不放入口页
#
# 只有 `view/` 一个顶层目录，站点根（`/`）**刻意不放任何文件**：两个站点都是给特定
# 用户按链接直达的（管理端由运维打开、访客端由学习通内打开），不需要也不希望有一个
# 列出两者入口的落地页。唯一的例外是 `.nojekyll` —— 它必须留在根上才能关掉 Jekyll。
#
# ## 为什么部署路径必须在构建期算出来
#
# GitHub Pages 是**项目站点**，真实路径要么是 /<仓库名>/view/<站点>/，要么
# （配了自定义域名时） /view/<站点>/。资源前缀会改写产物内容本身，只能在 `pnpm build`
# 之前定死；否则 index.html 能打开、/misaka-assets/*.js 全 404 —— 白屏。
#
# 对应的构建期变量（见 web/admin 与 web/guest 的 vite.config.ts）：
#   ADMIN_WEB_PREFIX  管理端前缀，产物落 dist/<前缀>/
#   GUEST_WEB_PREFIX  访客端前缀，产物落 dist/<前缀>/
# 这两个名字与服务端镜像构建（docker build --build-arg）保持同一口径。
#
# 部署路径的取值顺序：
#   1) workflow_dispatch 的 base_path 输入（手动覆盖，只影响管理端，访客端由它派生）；
#   2) gh-pages 上已有 CNAME → /view/admin/ 与 /view/guest/（自定义域名下站点在根）；
#   3) 否则 → /<目标仓库名>/view/admin/ 与 /<目标仓库名>/view/guest/（项目页面的默认路径）。

on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:
    inputs:
      base_path:
        description: 管理端部署子路径（留空则自动推断；访客端取同级的 guest/）
        required: false
        default: ""
        type: string

concurrency:
  group: publish-web-pages
  cancel-in-progress: false

# 推送到 MisakaStudy 用的是仓库机密 PAT（私有仓库），GITHUB_TOKEN 只需要读本工作区。
permissions:
  contents: read

env:
  SITE_REPO: Sakana-1314/MisakaStudy
  SITE_BRANCH: gh-pages

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            web:
              - 'web/**'

  publish:
    name: 构建并发布到 gh-pages
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      # github.sha 是本仓库（Runner）的提交，不是被发布的源码版本，得从工作区里取。
      - name: 记录源码版本
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # 先读一下现存的 CNAME：配了自定义域名时站点在域名根，部署路径要跟着去掉仓库名。
      # 强制覆盖会把 CNAME 一起清掉，所以这里同时记下来，发布时原样写回。
      - name: 读取 CNAME 并计算部署路径
        id: base
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          INPUT_BASE: ${{ inputs.base_path }}
        run: |
          set -euo pipefail
          CNAME=""
          if RAW="$(gh api "repos/${SITE_REPO}/contents/CNAME?ref=${SITE_BRANCH}" --jq '.content' 2>/dev/null)"; then
            CNAME="$(printf '%s' "$RAW" | base64 -d | tr -d '[:space:]')"
          fi

          if [ -n "$INPUT_BASE" ]; then
            ADMIN_BASE="$INPUT_BASE"
          elif [ -n "$CNAME" ]; then
            ADMIN_BASE="/view/admin/"
          else
            ADMIN_BASE="/${SITE_REPO#*/}/view/admin/"
          fi
          # 访客端与管理端同层：把管理端前缀的最后一段换掉。
          # 例：/MisakaStudy/view/admin/ → /MisakaStudy/view/guest/
          GUEST_BASE="${ADMIN_BASE%admin/}guest/"

          {
            echo "admin_base=$ADMIN_BASE"
            echo "guest_base=$GUEST_BASE"
            echo "cname=$CNAME"
          } >> "$GITHUB_OUTPUT"
          echo "管理端=${ADMIN_BASE} 访客端=${GUEST_BASE} 自定义域名=${CNAME:-无}"

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # 与 web/admin/Dockerfile 同一配方：Corepack 按 package.json 的 packageManager 字段
      # （pnpm@11.7.0）取对应版本，拿不到 Corepack 时退回 npm 全局安装。
      # 不走 pnpm/action-setup 是为了让 CI 与镜像里的安装方式一致 —— 镜像里用的也是 Corepack。
      - name: 安装 pnpm
        run: |
          set -euo pipefail
          if command -v corepack >/dev/null 2>&1; then
            corepack enable
          else
            npm i -g pnpm@11.7.0
          fi

      - name: 安装管理端依赖
        working-directory: web/admin
        run: pnpm install --frozen-lockfile

      - name: 构建管理端
        working-directory: web/admin
        env:
          ADMIN_WEB_PREFIX: ${{ steps.base.outputs.admin_base }}
        run: pnpm build

      - name: 安装访客端依赖
        working-directory: web/guest
        run: pnpm install --frozen-lockfile

      - name: 构建访客端
        working-directory: web/guest
        env:
          GUEST_WEB_PREFIX: ${{ steps.base.outputs.guest_base }}
        run: pnpm build

      - name: 发布到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          ADMIN_BASE: ${{ steps.base.outputs.admin_base }}
          GUEST_BASE: ${{ steps.base.outputs.guest_base }}
          CNAME: ${{ steps.base.outputs.cname }}
        run: |
          set -euo pipefail
          SITE="${RUNNER_TEMP}/site"
          rm -rf "$SITE"
          # 分支里的目录是 view/admin 与 view/guest：gh-pages 的根就是站点根，
          # 文件放在 view/admin/ 下就对应 URL /<仓库名>/view/admin/ 或 /view/admin/
          # （有 CNAME 时），与构建期前缀一一对应。可变的是前缀，不是这里的目录。
          mkdir -p "$SITE/view/admin" "$SITE/view/guest"

          # 两个站点的 vite 都把产物落在 `dist/<前缀>`（前缀去掉首尾斜杠），
          # 所以这里按前缀拼出产物路径，而不是写死 dist/admin —— 项目页面下前缀是
          # /<仓库名>/view/admin/，产物实际在 dist/<仓库名>/view/admin/。
          cp -a "$GITHUB_WORKSPACE/web/admin/dist${ADMIN_BASE%/}/." "$SITE/view/admin/"
          cp -a "$GITHUB_WORKSPACE/web/guest/dist${GUEST_BASE%/}/." "$SITE/view/guest/"

          # 关掉 Jekyll：产物分支不需要它处理，也免得下划线开头的文件被静默忽略。
          # 它在站点根上，是根目录唯一保留的文件。
          touch "$SITE/.nojekyll"

          # 自定义域名必须在树上，否则强制覆盖一次就把域名配置删了。
          if [ -n "$CNAME" ]; then printf '%s\n' "$CNAME" > "$SITE/CNAME"; fi

          # **刻意不放根目录入口页**：两个站点都是给特定用户按链接直达的
          # （管理端由运维打开、访客端在学习通内打开），不需要一个列出两者的落地页。
          # 站点根访问会得到 404，这是预期行为。

          # 每次都是全新提交树，强制覆盖远端分支：gh-pages 只保留当前这一版产物。
          git init -q -b "$SITE_BRANCH" "$SITE"
          git -C "$SITE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${SITE_REPO}.git"

          # 提交者用 GitHub Actions 的机器人身份：产物分支的提交来自 CI 而不是某个人，
          # 在提交列表里一眼就能区分「机器发布」与「人工改动」。
          # 邮箱固定为 github-actions[bot] 的 noreply 地址，否则提交不会关联到该账号。
          git -C "$SITE" add -A
          git -C "$SITE" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(web): 发布静态站点（${SOURCE_SHA:0:7}）"
          git -C "$SITE" push --force origin "HEAD:${SITE_BRANCH}"

          echo "已发布 ${ADMIN_BASE} 与 ${GUEST_BASE} 到 ${SITE_REPO}@${SITE_BRANCH}"
