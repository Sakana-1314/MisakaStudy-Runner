name: 静态站点发布


on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:
    inputs:
      base_path:
        description: 管理端部署子路径（留空用 /view/admin/；访客端取同级的 guest/）
        required: false
        default: ""
        type: string

concurrency:
  group: publish-web-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_REPO: Sakana-1314/MisakaStudy
  SITE_BRANCH: gh-pages

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            web:
              - 'web/**'

  publish:
    name: 构建并发布到 gh-pages
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 记录源码版本
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 读取 CNAME 并计算部署路径
        id: base
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          INPUT_BASE: ${{ inputs.base_path }}
        run: |
          set -euo pipefail
          CNAME=""
          if RAW="$(gh api "repos/${SITE_REPO}/contents/CNAME?ref=${SITE_BRANCH}" --jq '.content' 2>/dev/null)"; then
            CNAME="$(printf '%s' "$RAW" | base64 -d | tr -d '[:space:]')"
          fi

          if [ -n "$INPUT_BASE" ]; then
            ADMIN_BASE="$INPUT_BASE"
          else
            ADMIN_BASE="/view/admin/"
          fi
          GUEST_BASE="${ADMIN_BASE%admin/}guest/"
          DOCS_BASE="${ADMIN_BASE%admin/}docs/"

          {
            echo "admin_base=$ADMIN_BASE"
            echo "guest_base=$GUEST_BASE"
            echo "docs_base=$DOCS_BASE"
            echo "cname=$CNAME"
          } >> "$GITHUB_OUTPUT"
          echo "管理端=${ADMIN_BASE} 访客端=${GUEST_BASE} 文档站=${DOCS_BASE} 自定义域名=${CNAME:-无}"

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 安装 pnpm
        run: |
          set -euo pipefail
          if command -v corepack >/dev/null 2>&1; then
            corepack enable
          else
            npm i -g pnpm@11.7.0
          fi

      - name: 安装管理端依赖
        working-directory: web/admin
        run: pnpm install --frozen-lockfile

      - name: 构建管理端
        working-directory: web/admin
        env:
          ADMIN_WEB_PREFIX: ${{ steps.base.outputs.admin_base }}
        run: pnpm build

      - name: 安装访客端依赖
        working-directory: web/guest
        run: pnpm install --frozen-lockfile

      - name: 构建访客端
        working-directory: web/guest
        env:
          GUEST_WEB_PREFIX: ${{ steps.base.outputs.guest_base }}
        run: pnpm build

      - name: 安装文档站依赖
        working-directory: web/docs
        run: npm ci --include=dev

      - name: 构建文档站
        working-directory: web/docs
        env:
          DOCS_WEB_PREFIX: ${{ steps.base.outputs.docs_base }}
        run: npm run docs:build

      - name: 发布到 gh-pages
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          SOURCE_SHA: ${{ steps.src.outputs.sha }}
          ADMIN_BASE: ${{ steps.base.outputs.admin_base }}
          GUEST_BASE: ${{ steps.base.outputs.guest_base }}
          DOCS_BASE: ${{ steps.base.outputs.docs_base }}
          CNAME: ${{ steps.base.outputs.cname }}
        run: |
          set -euo pipefail
          SITE="${RUNNER_TEMP}/site"
          rm -rf "$SITE"
          mkdir -p "$SITE/view/admin" "$SITE/view/guest" "$SITE/view/docs"

          cp -a "$GITHUB_WORKSPACE/web/admin/dist${ADMIN_BASE%/}/." "$SITE/view/admin/"
          cp -a "$GITHUB_WORKSPACE/web/guest/dist${GUEST_BASE%/}/." "$SITE/view/guest/"
          cp -a "$GITHUB_WORKSPACE/web/docs/.vitepress/dist/." "$SITE/view/docs/"

          touch "$SITE/.nojekyll"

          if [ -n "$CNAME" ]; then printf '%s\n' "$CNAME" > "$SITE/CNAME"; fi


          git init -q -b "$SITE_BRANCH" "$SITE"
          git -C "$SITE" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${SITE_REPO}.git"

          git -C "$SITE" add -A
          git -C "$SITE" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(web): 发布静态站点（${SOURCE_SHA:0:7}）"
          git -C "$SITE" push --force origin "HEAD:${SITE_BRANCH}"

          echo "已发布 ${ADMIN_BASE}、${GUEST_BASE} 与 ${DOCS_BASE} 到 ${SITE_REPO}@${SITE_BRANCH}"
