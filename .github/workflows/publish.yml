name: 发布


on:
  workflow_dispatch:
    inputs:
      args:
        description: 追加传给发布脚本的位置参数（可空）
        required: false
        default: ""
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: 执行发布脚本
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          token: ${{ secrets.PAT }}

      - name: 运行发布脚本
        env:
          PUBLISH_SCRIPT: ${{ secrets.PUBLISH }}
          PUBLISH_ARGS: ${{ inputs.args }}
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail

          [ -n "$PUBLISH_SCRIPT" ] || { echo "未找到机密 PUBLISH，请先在仓库 Settings → Secrets 配置后重试"; exit 1; }

          SCRIPT="$RUNNER_TEMP/publish.sh"
          printf '%s\n' "$PUBLISH_SCRIPT" | sed 's/\r$//' > "$SCRIPT"
          chmod +x "$SCRIPT"

          PUBLISH_REF="$(git symbolic-ref --short -q HEAD || git rev-parse --short HEAD)"
          export PUBLISH_REF
          echo "工作区为 MisakaStudy@${PUBLISH_REF}，开始执行发布脚本…"

          if [ -n "$PUBLISH_ARGS" ]; then
            read -r -a ARGV <<< "$PUBLISH_ARGS"
            bash "$SCRIPT" "${ARGV[@]}"
          else
            bash "$SCRIPT"
          fi
