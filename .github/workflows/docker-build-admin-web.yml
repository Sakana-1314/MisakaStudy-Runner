name: 管理端前端镜像构建

# 由 MisakaStudy 仓库 trigger.yml 经 repository_dispatch(misaka_push) 触发，仅在 web/** 变更时构建；
# 也可在 Runner 仓库手动触发（workflow_dispatch，构建本镜像）。
#
# 与 docker-build-server.yml 同构：私有仓库的 push 事件是**无条件**派发的，
# 具体该不该构建由本文件的 paths-filter 判断，因此 trigger.yml 不必改。
on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:

concurrency:
  group: docker-build-admin-web
  cancel-in-progress: false

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      adminweb: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.adminweb == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            adminweb:
              - 'web/**'

  build:
    name: 构建并推送管理端前端镜像
    needs: detect
    if: needs.detect.outputs.adminweb == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      # 产物是纯静态站点，接口地址由用户在登录页填写（见 web/admin/src/stores/endpoint.ts），
      # 因此**不需要任何构建期变量**：一份镜像连任意后端。
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./web/admin
          file: ./web/admin/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:admin-web
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=adminweb
          cache-to: type=gha,mode=max,scope=adminweb
