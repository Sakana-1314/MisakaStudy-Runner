name: 基础测试

on:
  repository_dispatch:
    types: [misaka_pr]

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' }}
      edge_apis: ${{ steps.filter.outputs.edge_apis == 'true' }}
      edge_manger: ${{ steps.filter.outputs.edge_manger == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/core/**'
            edge_apis:
              - 'server/edge/**'
            edge_manger:
              - 'edge/manger/**'

  export-openapi:
    name: 校验 OpenAPI 规范
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/core
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 校验规范与路由表一致
        run: go test ./internal/server/ -run 'TestOpenAPISpecMatchesRoutes|TestSpecHasNoExtraPaths' -v

      - name: 回写导出状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          HEAD="${{ github.event.client_payload.ref }}"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            CUR="$(gh api "repos/Sakana-1314/MisakaStudy/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
            if [ -n "$CUR" ]; then HEAD="$CUR"; fi
          fi
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写导出状态到 MisakaStudy")) | .id' | head -1)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$JOB_ID"
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/$HEAD \
            -f state="$state" \
            -f context='导出 OpenAPI 规范（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$RUN_URL"

  server-tests:
    name: 服务端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/core

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: misaka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      db_user: postgres
      db_password: test
      db_host: 127.0.0.1
      db_port: 5432
      db_name: misaka_test
      secret: e2e-test-secret-key-32chars!!
      INTERNAL_TOKEN: test-admin-token
      MAIN_APPID: wx-e2e-test-appid

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: Go 代码格式检查
        run: test -z "$(gofmt -l .)"

      - name: Go 代码检查
        run: go vet ./...

      - name: 校验依赖注入装配
        run: go test -run TestDependencyGraph ./tests/arch/

      - name: 建表并写入测试数据
        run: |
          go run ./cmd/dbinit
          go run ./cmd/dbseed

      - name: 解析学习通测试凭据
        env:
          CX_STUDENT_RAW: ${{ secrets.CX_STUDENT }}
          CX_TEACHER_RAW: ${{ secrets.CX_TEACHER }}
        run: |
          set -euo pipefail
          parse() {
            local scope="$1"
            local raw="$2"
            if [ -z "$raw" ]; then
              return 0
            fi
            printf '%s' "$raw" | tr '&' '\n' | while IFS= read -r pair; do
              if [ -z "$pair" ]; then
                continue
              fi
              key="${pair%%=*}"
              value="${pair#*=}"
              if [ "$key" = "$pair" ]; then
                continue
              fi
              case "$key" in
                username) printf '%s\n' "${scope}_USERNAME=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                password) printf '%s\n' "${scope}_PASSWORD=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                courseId) printf '%s\n' "E2E_COURSE_ID=$value" >> "$GITHUB_ENV" ;;
                classId) printf '%s\n' "E2E_CLASS_ID=$value" >> "$GITHUB_ENV" ;;
              esac
            done
          }
          parse CX_TEACHER "$CX_TEACHER_RAW"
          parse CX "$CX_STUDENT_RAW"
      - name: 单元测试（含表结构不变量与分层边界）
        run: go test ./... -v

      - name: 覆盖率门禁（生产代码不回退）
        run: |
          set -euo pipefail
          go test -count=1 -coverpkg=./... -coverprofile=cover.out ./...
          go run ./cmd/covergate -profile cover.out -baseline coverage-baseline.txt -min 99

  server-e2e:
    name: 服务端端到端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/core

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: misaka_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      db_user: postgres
      db_password: test
      db_host: 127.0.0.1
      db_port: 5432
      db_name: misaka_e2e
      secret: e2e-test-secret-key-32chars!!
      INTERNAL_TOKEN: test-admin-token
      MAIN_APPID: wx-e2e-test-appid
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 解析学习通测试凭据
        env:
          CX_STUDENT_RAW: ${{ secrets.CX_STUDENT }}
          CX_TEACHER_RAW: ${{ secrets.CX_TEACHER }}
        run: |
          set -euo pipefail
          parse() {
            local scope="$1"
            local raw="$2"
            if [ -z "$raw" ]; then
              return 0
            fi
            printf '%s' "$raw" | tr '&' '\n' | while IFS= read -r pair; do
              if [ -z "$pair" ]; then
                continue
              fi
              key="${pair%%=*}"
              value="${pair#*=}"
              if [ "$key" = "$pair" ]; then
                continue
              fi
              case "$key" in
                username) printf '%s\n' "${scope}_USERNAME=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                password) printf '%s\n' "${scope}_PASSWORD=$value" >> "$GITHUB_ENV"; printf '::add-mask::%s\n' "$value" ;;
                courseId) printf '%s\n' "E2E_COURSE_ID=$value" >> "$GITHUB_ENV" ;;
                classId) printf '%s\n' "E2E_CLASS_ID=$value" >> "$GITHUB_ENV" ;;
              esac
            done
          }
          parse CX_TEACHER "$CX_TEACHER_RAW"
          parse CX "$CX_STUDENT_RAW"
      - name: 运行端到端测试
        run: go test ./tests/e2e/... -v

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs
          path: |
            server/core/logs/
            /tmp/e2e-run/server.log
          if-no-files-found: ignore

  server-live-tests:
    name: 服务端真实上游测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/core

    env:
      secret: live-upstream-test-secret-32byte
      db_name: misaka_test
      db_user: postgres
      db_password: test
      db_host: 127.0.0.1
      db_port: 5432
      INTERNAL_TOKEN: live-internal-token
      MAIN_APPID: wx-live-test
      LIVE_UPSTREAM: '1'

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 运行真实上游测试
        run: go test ./tests/live/... ./internal/upstreams/feishu/... ./internal/upstreams/edgeone/... -v

  server-fuzz-tests:
    name: 服务端模糊测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/core

    env:
      secret: fuzz-test-secret-key-32bytes!!!
      db_name: misaka_test
      db_user: postgres
      db_password: test
      db_host: 127.0.0.1
      db_port: 5432
      INTERNAL_TOKEN: fuzz-internal-token
      MAIN_APPID: wx-fuzz-test
      REQUEST_LOG_ENABLED: 'false'

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 模糊测试安全解析入口
        run: |
          set -euo pipefail
          dirs="$(grep -rl --include='*_test.go' -E '^func Fuzz' internal || true)"
          if [ -z "$dirs" ]; then
            echo "internal/ 下没有模糊测试目标，跳过"
            exit 0
          fi
          for dir in $(printf '%s\n' "$dirs" | xargs -n1 dirname | sort -u); do
            for target in $(go test -list '^Fuzz' "./${dir}" | grep '^Fuzz' || true); do
              echo "::group::${dir} ${target}"
              go test -run '^$' -fuzz "^${target}$" -fuzztime 45s "./${dir}"
              echo "::endgroup::"
            done
          done

      - name: 归档失败语料
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-server
          path: server/core/internal/**/testdata/fuzz/
          if-no-files-found: ignore

  edge-apis-tests:
    name: 边缘接口测试
    needs: detect
    if: needs.detect.outputs.edge_apis == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server/edge

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/edge/go.mod

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  edge-manger-tests:
    name: 边缘管理程序测试
    needs: detect
    if: needs.detect.outputs.edge_manger == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/manger

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: edge/manger/go.sum

      - name: Go 代码格式检查
        run: test -z "$(gofmt -l .)"

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  checks:
    name: 测试通过检查
    if: always()
    needs: [detect, export-openapi, server-tests, server-e2e, server-live-tests, server-fuzz-tests, edge-apis-tests, edge-manger-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: 检查测试结果
        run: |
          results=(
            "${{ needs.detect.result }}"
            "${{ needs.export-openapi.result }}"
            "${{ needs.server-tests.result }}"
            "${{ needs.server-e2e.result }}"
            "${{ needs.server-live-tests.result }}"
            "${{ needs.server-fuzz-tests.result }}"
            "${{ needs.edge-apis-tests.result }}"
            "${{ needs.edge-manger-tests.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::存在未通过的检查（$r），测试不通过不允许合并"
              exit 1
            fi
          done
          echo "全部检查通过"

      - name: 回写测试状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          HEAD="${{ github.event.client_payload.ref }}"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            CUR="$(gh api "repos/Sakana-1314/MisakaStudy/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
            if [ -n "$CUR" ]; then HEAD="$CUR"; fi
          fi
          TEST_JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写测试状态到 MisakaStudy")) | .id' | head -1)"
          EXP_JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写导出状态到 MisakaStudy")) | .id' | head -1)"
          TEST_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$TEST_JOB_ID"
          EXP_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$EXP_JOB_ID"
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/$HEAD \
            -f state="$state" \
            -f context='测试通过检查（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$TEST_RUN_URL"

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            MARKER='🤖 **MisakaStudy Runner** 门禁汇总'
            state_text="✅"
            [ "$state" = "success" ] || state_text="❌"
            exp_state="$(gh api "repos/Sakana-1314/MisakaStudy/commits/$HEAD/status" \
              --jq -r '[.statuses[] | select(.context == "导出 OpenAPI 规范（Runner）")] | .[0].state // empty' 2>/dev/null || true)"
            exp_text="✅"
            [ "$exp_state" = "success" ] || exp_text="❌"
            body="$(printf '%s\n\n- 测试通过检查（Runner）：%s\n  [查看测试 Job](%s)\n- 导出 OpenAPI 规范（Runner）：%s\n  [查看导出 Job](%s)' \
              "$MARKER" "$state_text" "$TEST_RUN_URL" "$exp_text" "$EXP_RUN_URL")"
            existing="$(gh api "repos/Sakana-1314/MisakaStudy/issues/$PR_NUMBER/comments?per_page=100" \
              --jq --arg m "$MARKER" '[.[] | select((.body // "") | contains($m))] | .[0].id // empty' || true)"
            if [ -n "$existing" ]; then
              jq -n --arg body "$body" '{body:$body}' | \
                gh api -X PATCH "repos/Sakana-1314/MisakaStudy/issues/comments/$existing" --input -
            else
              jq -n --arg body "$body" '{body:$body}' | \
                gh api -X POST "repos/Sakana-1314/MisakaStudy/issues/$PR_NUMBER/comments" --input -
            fi
          fi
