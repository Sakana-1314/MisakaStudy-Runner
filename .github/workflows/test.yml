name: 基础测试

# 由 MisakaStudy 仓库的 trigger.yml 通过 repository_dispatch 触发（PR 事件）
# 检出 MisakaStudy 对应 commit 执行测试；OpenAPI 导出先推送规范到 PR 分支，
# checks 在其后把聚合状态回写到「PR 当前 head」（避免导出 commit 使旧 head 的
# status 在 PR 上失效），并以单条固定评论汇总门禁结果。
on:
  repository_dispatch:
    types: [misaka_pr]

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server == 'true' }}
      edge_apis: ${{ steps.filter.outputs.edge_apis == 'true' }}
      edge_manger: ${{ steps.filter.outputs.edge_manger == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            server:
              - 'server/**'
            edge_apis:
              - 'edge/apis/**'
            edge_manger:
              - 'edge/manger/**'

  export-openapi:
    name: 校验 OpenAPI 规范
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 校验规范与路由表一致
        # 规范是人工维护的接口事实来源：这里用回归测试锁定「规范 ↔ 注册路由」双向一致、
        # 每个操作有中文说明与响应 schema、不出现 operationId。不做导出提交，
        # 规范改动随代码一起进 PR，评审时可见。
        run: go test ./internal/domain/ -run 'TestOpenAPISpecMatchesRoutes|TestSpecHasNoExtraPaths' -v

      - name: 回写导出状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          HEAD="${{ github.event.client_payload.ref }}"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            CUR="$(gh api "repos/Sakana-1314/MisakaStudy/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
            if [ -n "$CUR" ]; then HEAD="$CUR"; fi
          fi
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写导出状态到 MisakaStudy")) | .id' | head -1)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$JOB_ID"
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/$HEAD \
            -f state="$state" \
            -f context='导出 OpenAPI 规范（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$RUN_URL"

  server-tests:
    name: 服务端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: misaka_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # 服务端与测试进程共用同一套环境变量（大小写由 config 统一兼容）
      db_user: root
      db_password: test
      db_host: 127.0.0.1
      db_port: 3306
      db_name: misaka_test
      secret: e2e-test-secret-key-32chars!!
      INTERNAL_TOKEN: test-admin-token
      MAIN_APPID: wx-e2e-test-appid
      # 真机学习通账号：只在存在时跑在线用例（缺失时用例自行 skip）
      CX_USERNAME: ${{ secrets.CX_USERNAME }}
      CX_PASSWORD: ${{ secrets.CX_PASSWORD }}

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Go 代码格式检查
        run: test -z "$(gofmt -l .)"

      - name: Go 代码检查
        run: go vet ./...

      - name: 校验依赖注入装配
        # 装配已从 google/wire（编译期代码生成）改为 uber/fx（运行期解析）：
        # `wire check` 不再适用，「生成物与 provider 集合不一致」这类问题也不存在了。
        # 但编译通过**不代表依赖图完整**，因此改用 fx.ValidateApp 在测试期解析整张图
        # （tests/arch/wiring_test.go），缺 provider 或循环依赖会在这里被拦下。
        run: go test -run TestDependencyGraph ./tests/arch/

      - name: 建表并写入测试数据
        # 表结构不变量测试与需要库的单元测试都直接打真实 MySQL；库由本仓工具建，
        # 保证中文列注释的字符集正确（用命令行客户端灌 SQL 会把注释写花）
        run: |
          go run ./cmd/dbinit
          go run ./cmd/dbseed

      - name: 单元测试（含表结构不变量与分层边界）
        run: go test ./... -v

      - name: 覆盖率门禁（生产代码不回退）
        # 覆盖 cmd/ 与 internal/（不含 tests/ 测试基座），要求未覆盖块不超出基线。
        # 剩余未覆盖块都是防御性分支（覆盖它们需要改生产代码），因此门禁盯的是「不回退」
        # 而不是把数字凑成 100%：任何新增的未覆盖生产代码都会让这里变红。
        run: |
          set -euo pipefail
          go test -count=1 -coverpkg=./... -coverprofile=cover.out ./...
          go run ./cmd/covergate -profile cover.out -baseline scripts/coverage-baseline.txt -min 99

  server-e2e:
    name: 服务端端到端测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: misaka_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # 被测服务与 E2E 测试进程共用同一套环境变量（含密钥，两边派生的令牌才同源）
      db_user: root
      db_password: test
      db_host: 127.0.0.1
      db_port: 3306
      db_name: misaka_e2e
      secret: e2e-test-secret-key-32chars!!
      INTERNAL_TOKEN: test-admin-token
      MAIN_APPID: wx-e2e-test-appid
      E2E_BASE_URL: http://127.0.0.1:8000
      # 真机学习通账号：注入后在线用例才会执行（缺失时用例自行 skip，不会伪装通过）
      CX_USERNAME: ${{ secrets.CX_USERNAME }}
      CX_PASSWORD: ${{ secrets.CX_PASSWORD }}

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 运行端到端测试
        # 测试自行完成：起假上游（微信 / 超星 / QQ，不触网）→ 建表与种子 → 编译并拉起真实
        # 服务端进程（随机端口）→ 跑完全部接口用例 → 收尾。因此这里不需要预先启动服务，
        # 也不会与开发机上已运行的服务抢 8000 端口。
        run: go test ./tests/e2e/... -v

      - name: 上传服务端日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          # 服务端由测试进程拉起在自己的临时目录里；失败时日志已随 `go test -v` 打进构建输出。
          # 这里额外收集仓库内日志目录（本地路径场景），缺失不报错。
          path: |
            server/logs/
            /tmp/e2e-run/server.log
          if-no-files-found: ignore

  server-live-tests:
    name: 服务端真实上游测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    env:
      # 只做必填项；上游地址一律用配置默认值（即现网地址），真实请求测试要的正是那套默认值
      secret: live-upstream-test-secret-32byte
      db_name: misaka_test
      db_user: root
      db_password: test
      db_host: 127.0.0.1
      db_port: 3306
      INTERNAL_TOKEN: live-internal-token
      MAIN_APPID: wx-live-test
      # 打开真实请求开关：显式开启后网络不可达按失败处理，不会伪装成 skip
      LIVE_UPSTREAM: '1'

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 运行真实上游测试
        # 打真实第三方：超星滑块验证码与登录页、DoH、QQ 机器人、飞书、钉钉、EdgeOne。
        # 微信侧（jscode2session / access_token / getuserencryptkey）需要真实小程序凭据与
        # 真实用户 code，不在本 job 覆盖；假上游对应的 E2E job 已覆盖微信链路。
        # 用假凭据打真实服务，断言拿到确定的**业务错误**——这验证地址、参数名、签名算法
        # 与错误解析在真实服务面前成立（假上游只能证明代码自洽）。
        run: go test ./tests/live/... ./internal/upstreams/feishu/... ./internal/upstreams/dingtalk/... ./internal/upstreams/edgeone/... -v

  server-fuzz-tests:
    name: 服务端模糊测试
    needs: detect
    if: needs.detect.outputs.server == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    env:
      secret: fuzz-test-secret-key-32bytes!!!
      db_name: misaka_test
      db_user: root
      db_password: test
      db_host: 127.0.0.1
      db_port: 3306
      INTERNAL_TOKEN: fuzz-internal-token
      MAIN_APPID: wx-fuzz-test
      REQUEST_LOG_ENABLED: 'false'

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 模糊测试安全解析入口
        # 这些函数（令牌、签名值、clientId）的输入全部来自网络，最重要的不变量是
        # 「任意字节串都不得 panic」与「未正确签名的输入绝不被接受」。
        # 时长按目标数控制，保证门禁总耗时可控。
        run: |
          set -euo pipefail
          targets=(
            FuzzVerifyShortSignTokens
            FuzzDecodeTokens
            FuzzVerifySignatureAndChallenge
            FuzzDecodeAndDecrypt
            FuzzDecryptClientInfo
          )
          for target in "${targets[@]}"; do
            echo "::group::${target}"
            go test -run '^$' -fuzz "^${target}$" -fuzztime 45s ./internal/core/security/
            echo "::endgroup::"
          done

      - name: 归档失败语料
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-server
          path: server/internal/core/security/testdata/fuzz/
          if-no-files-found: ignore

  edge-apis-tests:
    name: 边缘接口测试
    needs: detect
    if: needs.detect.outputs.edge_apis == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/apis

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: edge/apis/go.sum

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  edge-manger-tests:
    name: 边缘管理程序测试
    needs: detect
    if: needs.detect.outputs.edge_manger == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: edge/manger

    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: edge/manger/go.sum

      - name: Go 代码格式检查
        run: test -z "$(gofmt -l .)"

      - name: Go 代码检查
        run: go vet ./...

      - name: Go 单元测试
        run: go test ./... -v

      - name: Go 构建
        run: go build ./...

  checks:
    name: 测试通过检查
    # 无论测试/导出 job 是跳过还是失败都运行，聚合为明确的合并门禁结论；
    # 依赖 export-openapi 保证导出 commit 已落地后，再回写到 PR 当前 head。
    if: always()
    needs: [detect, export-openapi, server-tests, server-e2e, server-live-tests, server-fuzz-tests, edge-apis-tests, edge-manger-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: 检查测试结果
        run: |
          results=(
            "${{ needs.detect.result }}"
            "${{ needs.export-openapi.result }}"
            "${{ needs.server-tests.result }}"
            "${{ needs.server-e2e.result }}"
            "${{ needs.server-live-tests.result }}"
            "${{ needs.server-fuzz-tests.result }}"
            "${{ needs.edge-apis-tests.result }}"
            "${{ needs.edge-manger-tests.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::存在未通过的检查（$r），测试不通过不允许合并"
              exit 1
            fi
          done
          echo "全部检查通过"

      - name: 回写测试状态到 MisakaStudy
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          HEAD="${{ github.event.client_payload.ref }}"
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            CUR="$(gh api "repos/Sakana-1314/MisakaStudy/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || true)"
            if [ -n "$CUR" ]; then HEAD="$CUR"; fi
          fi
          # job context 无 name 字段、github.job_id 在配置阶段为空，改为按本步骤名反查当前 job 的 ID
          TEST_JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写测试状态到 MisakaStudy")) | .id' | head -1)"
          EXP_JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写导出状态到 MisakaStudy")) | .id' | head -1)"
          TEST_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$TEST_JOB_ID"
          EXP_RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/$EXP_JOB_ID"
          gh api -X POST \
            repos/Sakana-1314/MisakaStudy/statuses/$HEAD \
            -f state="$state" \
            -f context='测试通过检查（Runner）' \
            -f description='由 MisakaStudy-Runner 仓库代为执行' \
            -f target_url="$TEST_RUN_URL"

          # 单条固定评论：先在 PR 上找固定标记的已有评论，存在则更新，否则新增
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            MARKER='🤖 **MisakaStudy Runner** 门禁汇总'
            state_text="✅"
            [ "$state" = "success" ] || state_text="❌"
            exp_state="$(gh api "repos/Sakana-1314/MisakaStudy/commits/$HEAD/status" \
              --jq -r '[.statuses[] | select(.context == "导出 OpenAPI 规范（Runner）")] | .[0].state // empty' 2>/dev/null || true)"
            exp_text="✅"
            [ "$exp_state" = "success" ] || exp_text="❌"
            body="$(printf '%s\n\n- 测试通过检查（Runner）：%s\n  [查看测试 Job](%s)\n- 导出 OpenAPI 规范（Runner）：%s\n  [查看导出 Job](%s)' \
              "$MARKER" "$state_text" "$TEST_RUN_URL" "$exp_text" "$EXP_RUN_URL")"
            existing="$(gh api "repos/Sakana-1314/MisakaStudy/issues/$PR_NUMBER/comments?per_page=100" \
              --jq --arg m "$MARKER" '[.[] | select((.body // "") | contains($m))] | .[0].id // empty' || true)"
            if [ -n "$existing" ]; then
              jq -n --arg body "$body" '{body:$body}' | \
                gh api -X PATCH "repos/Sakana-1314/MisakaStudy/issues/comments/$existing" --input -
            else
              jq -n --arg body "$body" '{body:$body}' | \
                gh api -X POST "repos/Sakana-1314/MisakaStudy/issues/$PR_NUMBER/comments" --input -
            fi
          fi
