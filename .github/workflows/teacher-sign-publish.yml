name: 签到发布

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 要测试的 MisakaStudy 分支或 commit（留空用 next）
        required: false
        default: next
      mode:
        description: 发布模式（manual=只清“手动发布”分组；auto=等同定时，清空班级全部活动并入“自动发布”）
        required: false
        default: manual
        type: choice
        options:
          - manual
          - auto

permissions:
  contents: read

concurrency:
  group: teacher-sign-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 发布签到
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/core
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ inputs.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/core/go.sum

      - name: 校验签到凭据
        env:
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
        run: |
          if [ -z "$CX_TEACHER" ]; then
            echo "缺少 CX_TEACHER 机密，无法发布签到" >&2
            exit 1
          fi

      - name: 发布签到
        env:
          LIVE_UPSTREAM: '1'
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
          CX_SIGN_TRIGGER: ${{ github.event_name == 'schedule' && 'auto' || (inputs.mode || 'manual') }}
          TZ: Asia/Shanghai
        run: |
          if go test ./tests/live/ -run TestLiveTeacherPublishAllSignTypes -v -count=1 > publish.log 2>&1; then
            echo "发布签到流程完成"
          else
            status=$?
            echo "::error::发布签到失败；完整日志含 classId/activeId 等内部信息，已丢弃，不写入公开日志"
            exit "$status"
          fi

      - name: 生成发布摘要
        if: always()
        run: |
          if [ -f publish.log ]; then
            {
              echo '### 签到发布'
              echo ''
              echo '| 班级 | 签到名称 | 发布结果 |'
              echo '| --- | --- | --- |'
              sed -nE 's/.*发布汇总：(.*)/\1/p' publish.log | while IFS= read -r line; do
                printf '%s\n' "$line" | jq -r '"| " + (.class | gsub("\\|"; "\\|")) + " | " + (.name | gsub("\\|"; "\\|")) + " | " + (.result | gsub("\\|"; "\\|") | gsub("\r"; "") | gsub("\n"; "<br>")) + " |"' || true
              done
              echo ''
              echo '### 签到二维码'
              echo ''
              echo '| 班级 | 二维码 |'
              echo '| --- | --- |'
              sed -nE 's/.*二维码汇总：(.*)/\1/p' publish.log | while IFS= read -r line; do
                printf '%s\n' "$line" | jq -r '"| " + (.class | gsub("\\|"; "\\|")) + " | ![二维码](" + .link + ") |"' || true
              done
            } | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f publish.log
          fi
