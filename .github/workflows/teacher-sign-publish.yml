name: 签到发布

# 每周六 06:00（北京时间，UTC+8）= 每周五 22:00 UTC 自动执行；也可在 Actions 页手动运行。
# 执行 MisakaStudy 的教师侧发签到 live 用例 TestLiveTeacherPublishAllSignTypes：
#   普通（拍照+滑块验证）、手势、手势+指定地点、位置、位置+指定地点+人脸、
#   二维码+指定地点+人脸+静态码。
# 需要 CX_TEACHER 机密（格式 courseId=...&username=...&password=...；classId 可选）。
# 自动触发（schedule）：CX_SIGN_TRIGGER=auto，删除班级内全部活动，发布后移入“自动发布”；
# 手动触发（workflow_dispatch）：CX_SIGN_TRIGGER=manual，只删“手动发布”分组里的签到。
# 两种模式都会在每个签到发布成功后用教师账号自签一次，结果写入运行摘要的表格。
# 定时与手动触发都签出 MisakaStudy 默认分支（next）。
on:
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teacher-sign-publish
  cancel-in-progress: false

jobs:
  publish:
    name: 发布六种教师签到
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/MisakaStudy
          token: ${{ secrets.PAT }}

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: 校验教师凭据
        env:
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
        run: |
          if [ -z "$CX_TEACHER" ]; then
            echo "缺少 CX_TEACHER 机密，无法发布签到" >&2
            exit 1
          fi

      - name: 发布签到并自签
        env:
          LIVE_UPSTREAM: '1'
          CX_TEACHER: ${{ secrets.CX_TEACHER }}
          CX_SIGN_TRIGGER: ${{ github.event_name == 'schedule' && 'auto' || 'manual' }}
          TZ: Asia/Shanghai
        run: |
          # 本仓库是公开仓库：完整测试输出里有 classId、activeId、自签响应与源码行号，
          # 只写入 runner 本地临时文件，禁止回显到 Actions 日志。
          if go test ./tests/live/ -run TestLiveTeacherPublishAllSignTypes -v -count=1 > publish.log 2>&1; then
            echo "发布签到流程完成"
          else
            status=$?
            echo "::error::发布签到失败；完整日志含 classId/activeId 等内部信息，已丢弃，不写入公开日志"
            exit "$status"
          fi

      - name: 输出发布摘要（表格）
        if: always()
        run: |
          # 只输出结构化摘要里的班级名、签到名称、自签结果和二维码图片；
          # 不得回显 publish.log 原文、classId、activeId 或源码行号。
          if [ -f publish.log ]; then
            {
              echo '### 签到发布'
              echo ''
              echo '| 班级 | 签到名称 | 自签结果 |'
              echo '| --- | --- | --- |'
              sed -nE 's/.*发布汇总：(.*)/\1/p' publish.log | while IFS= read -r line; do
                printf '%s\n' "$line" | jq -r '"| " + (.class | gsub("\\|"; "\\|")) + " | " + (.name | gsub("\\|"; "\\|")) + " | " + (.result | gsub("\\|"; "\\|") | gsub("\r"; "") | gsub("\n"; "<br>")) + " |"' || true
              done
              echo ''
              echo '### 签到二维码'
              echo ''
              echo '| 班级 | 二维码 |'
              echo '| --- | --- |'
              sed -nE 's/.*二维码汇总：(.*)/\1/p' publish.log | while IFS= read -r line; do
                printf '%s\n' "$line" | jq -r '"| " + (.class | gsub("\\|"; "\\|")) + " | ![二维码](" + .link + ") |"' || true
              done
            } >> "$GITHUB_STEP_SUMMARY"
            rm -f publish.log
          fi
