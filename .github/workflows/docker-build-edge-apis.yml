name: 边缘节点镜像构建

on:
  repository_dispatch:
    types: [misaka_push]
  workflow_dispatch:

concurrency:
  group: docker-build-edge-apis
  cancel-in-progress: false

jobs:
  detect:
    name: 检测变更路径
    runs-on: ubuntu-24.04
    outputs:
      edgeapis: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.edgeapis == 'true' }}
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 检测变更路径
        id: filter
        if: github.event_name == 'repository_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.client_payload.before }}
          ref: ${{ github.event.client_payload.ref }}
          filters: |
            edgeapis:
              - 'server/edge/**'

  build:
    name: 构建并推送边缘节点镜像
    needs: detect
    if: needs.detect.outputs.edgeapis == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 签出 MisakaStudy 代码
        uses: actions/checkout@v7
        with:
          repository: Sakana-1314/MisakaStudy
          ref: ${{ github.event.client_payload.ref || 'next' }}
          token: ${{ secrets.PAT }}

      - name: 安装 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录腾讯云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: ./server/edge
          file: ./server/edge/Dockerfile
          push: true
          tags: sgccr.ccs.tencentyun.com/misaka-network/chaoxing:edge-apis
          platforms: linux/amd64
          cache-from: type=gha,scope=edge-apis
          cache-to: type=gha,mode=max,scope=edge-apis
